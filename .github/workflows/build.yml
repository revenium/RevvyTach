name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-15
    timeout-minutes: 20

    # CI builds use no code signing (faster, sufficient for testing)

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26.0.1
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer

      - name: Show Build Environment
        run: |
          xcodebuild -version
          swift --version
          echo "macOS: $(sw_vers -productVersion)"

      - name: Validate localization catalogs
        run: ./scripts/validate_localizations.sh

      - name: Test localization validator
        run: ./scripts/tests/test_validate_localizations.sh

      - name: Test UsageKit packages
        run: swift test --package-path Packages/UsageKit

      - name: Build Debug (for tests)
        run: |
          xcodebuild build \
            -project "Claude Usage.xcodeproj" \
            -scheme "Claude Usage" \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Run Tests
        run: |
          xcodebuild test \
            -project "Claude Usage.xcodeproj" \
            -scheme "Claude Usage" \
            -configuration Debug \
            -derivedDataPath build \
            -destination "platform=macOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Crash reports (on test failure)
        if: failure()
        run: |
          echo "--- xcodebuild exited non-zero; looking for test-host crashes ---"
          grep -c "Restarting after unexpected exit" build/Logs/Test/*.xcresult 2>/dev/null || true
          for dir in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
            [ -d "$dir" ] || continue
            find "$dir" -name 'RevvyTach*' -newermt '-30 minutes' -print 2>/dev/null | while read -r report; do
              echo "===== $report ====="
              head -120 "$report"
            done
          done
          echo "--- end crash reports ---"

      - name: Build Release
        run: |
          xcodebuild build \
            -project "Claude Usage.xcodeproj" \
            -scheme "Claude Usage" \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create App Bundle Artifact
        run: |
          mkdir -p artifacts
          cp -R "build/Build/Products/Release/RevvyTach.app" artifacts/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RevvyTach-${{ github.sha }}
          path: artifacts/
          retention-days: 7

  codex-ui-tests:
    name: Codex UI parity
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26.0.1
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer

      - name: Run isolated Codex UI tests
        run: |
          mkdir -p build-ui-results
          xcodebuild test \
            -project "Claude Usage.xcodeproj" \
            -scheme "Claude Usage UI Tests" \
            -configuration UITesting \
            -derivedDataPath build-ui \
            -destination "platform=macOS,arch=arm64" \
            -resultBundlePath build-ui-results/CodexUI.xcresult

      - name: Enforce complete Codex UI execution
        if: always()
        run: |
          xcrun xcresulttool get test-results summary \
            --path build-ui-results/CodexUI.xcresult \
            | tee build-ui-results/summary.json
          jq -e '
            .result == "Passed"
            and .totalTestCount == 11
            and .passedTests == 11
            and .failedTests == 0
            and .skippedTests == 0
            and .expectedFailures == 0
          ' build-ui-results/summary.json

      - name: Upload Codex UI results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Codex-UI-${{ github.sha }}
          path: build-ui-results/
          if-no-files-found: warn
          retention-days: 7
